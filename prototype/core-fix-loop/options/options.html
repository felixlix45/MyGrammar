<!doctype html>
<!-- PROTOTYPE options/onboarding page — just enough to configure the provider. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyGrammar (prototype) — settings</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #1b1b1b; }
      h1 { font-size: 1.25rem; }
      .note { background: #fff8d6; border: 1px solid #e0c870; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; }
      label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: 0.9rem; }
      input[type="text"], input[type="password"] { width: 100%; padding: 8px; font-size: 0.9rem; box-sizing: border-box; border: 1px solid #999; border-radius: 4px; }
      .hint { color: #666; font-size: 0.8rem; margin-top: 4px; }
      .row { display: flex; gap: 8px; margin-top: 18px; }
      button { padding: 8px 14px; font-size: 0.9rem; cursor: pointer; border: 1px solid #444; background: #fff; border-radius: 4px; }
      button.primary { background: #1b6ec2; color: #fff; border-color: #1b6ec2; }
      #status { margin-top: 12px; font-size: 0.85rem; min-height: 1.2em; }
      .ok { color: #137a3b; } .err { color: #b3261e; }
      code { background: #f3f3f3; padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>MyGrammar — provider settings <small>(prototype)</small></h1>
    <div class="note">
      Prototype: the API key is stored <b>plaintext</b> in <code>chrome.storage.local</code>.
      Encryption is out of scope for this prototype (per ticket #5).
    </div>

    <label for="endpoint">Endpoint base URL</label>
    <input id="endpoint" type="text" placeholder="https://api.openai.com/v1" />
    <div class="hint">OpenAI-compatible base. The worker appends <code>/chat/completions</code>.</div>

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" placeholder="sk-..." />

    <label for="model">Model</label>
    <input id="model" type="text" placeholder="gpt-4o-mini" />

    <div class="row">
      <button id="save" class="primary">Save</button>
      <button id="test">Test connection</button>
    </div>
    <div id="status"></div>

    <script src="options.js"></script>
  </body>
</html>
